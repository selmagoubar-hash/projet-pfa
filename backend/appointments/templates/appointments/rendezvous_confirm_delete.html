{% extends 'base/base.html' %}

{% block title %}Supprimer rendez-vous{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="card shadow-sm border-0 mx-auto" style="max-width: 560px;">
        <div class="card-body">
            <h1 class="h4">Supprimer le rendez-vous</h1>
            <p>Confirmer la suppression du rendez-vous de {{ object.patient }} ?</p>
            <form method="post">
                {% csrf_token %}
                <button class="btn btn-danger" type="submit">Supprimer</button>
                <a class="btn btn-outline-secondary" href="{% url 'appointments:list' %}">Annuler</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
