{% extends 'base/base.html' %}
{% load crispy_forms_tags %}

{% block title %}Rendez-vous{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="card shadow-sm border-0 mx-auto" style="max-width: 760px;">
        <div class="card-body">
            <h1 class="h4 mb-3">Rendez-vous</h1>
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="d-flex gap-2">
                    <button class="btn btn-primary" type="submit">Enregistrer</button>
                    <a class="btn btn-outline-secondary" href="{% url 'appointments:list' %}">Retour</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
